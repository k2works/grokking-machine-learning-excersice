name: Grokking ML Samples

on:
  push:
    paths:
      - 'apps/grokking-ml-python/**'
      - 'apps/grokking-ml-kotlin/**'
      - 'apps/grokking-ml-fsharp/**'
      - '.github/workflows/grokking-ml.yml'
      - 'ops/scripts/notebooks.js'
  pull_request:
    paths:
      - 'apps/grokking-ml-python/**'
      - 'apps/grokking-ml-kotlin/**'
      - 'apps/grokking-ml-fsharp/**'
      - '.github/workflows/grokking-ml.yml'
      - 'ops/scripts/notebooks.js'

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/grokking-ml-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  kotlin:
    runs-on: ubuntu-latest
    # JDK を 1 つだけ固定していると、読者の環境（新しい JDK）で
    # Kotlin コンパイラが落ちる問題を CI が素通りさせてしまう。
    # 実際に Kotlin 2.0.21 が JDK 25 でビルドできない問題を CI が検出できなかった。
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    defaults:
      run:
        working-directory: apps/grokking-ml-kotlin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # clean を付けないと、キャッシュされた成果物で UP-TO-DATE になり
      # コンパイル自体が走らないことがある
      - name: Test
        run: ./gradlew clean test

  fsharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/grokking-ml-fsharp
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ノートブックは出力込みで commit する。未実行のまま入り込むのを防ぐ
      - name: Check notebooks are executed
        run: npm run notebooks:check
