site_name: Grokking Machine Learning
site_description: 機械学習アルゴリズムを Python・Kotlin・F# の 3 言語で自前実装しながら学ぶ記事シリーズ
site_author: k2works
site_url: https://k2works.github.io/grokking-machine-learning-excersice/
repo_url: https://github.com/k2works/grokking-machine-learning-excersice
repo_name: grokking-machine-learning-excersice

# 記事に特化したサイトにする。設計・運用・テンプレートなどの開発ドキュメントは
# リポジトリ内に残したまま、公開対象からは外す。
docs_dir: docs/article

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js
  - assets/js/extra.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works/grokking-machine-learning-excersice
      name: GitHub Repository

plugins:
  - search
  # ノートブックを記事として描画する（実行はしない。出力は保存済み）
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore_h1_titles: false
      show_input: true

nav:
  - Home: index.md
  - Grokking Machine Learning:
      - 概要: grokking-machine-learning/index.md
      - アウトライン: grokking-machine-learning/outline.md
      - 3 言語統合比較:
